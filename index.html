<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Controle de Ponto</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="shortcut icon" href="clock.png" type="image/x-icon">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <h1>Controle de Ponto</h1>
        <p>Usuário Nome</p>
      </div>
      <div class="header-right">
        <div class="profile-avatar">JS</div>
        <div class="profile-info">
          <span class="profile-name">João Silva</span>
          <span class="profile-role">Analista</span>
        </div>
      </div>
    </header>

    <!-- Summary cards -->
    <section class="summary-section">
      <div class="summary-card">
        <div class="summary-icon">🕒</div>
        <div class="summary-label">Horário Atual</div>
        <div class="summary-value" id="current-time">--:--</div>
      </div>
      <div class="summary-card">
        <div class="summary-icon">⏱️</div>
        <div class="summary-label">Hoje</div>
        <div class="summary-value" id="hours-today">00:00 h</div>
      </div>
      <div class="summary-card">
        <div class="summary-icon">💰</div>
        <div class="summary-label">Horas Extras no Mês</div>
        <div class="summary-value" id="extra-hours">07:45 h</div>
      </div>
    </section>

    <!-- Registro de ponto -->
    <section class="clock-section">
      <h2>Registro de Ponto</h2>
      <div class="clock-display">
        <div id="main-clock">--:--</div>
        <div id="main-date">--/--/----</div>
        <div id="main-weekday">---</div>
      </div>
      <button id="btn-marcar" class="btn-marcar">
        ✔ MARCAR PONTO
      </button>
    </section>

    <!-- Últimos registros -->
    <section class="logs-section">
      <h2>Últimos Registros</h2>
      <ul id="logs-list" class="logs-list">
        <!-- preenchido via JS -->
      </ul>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
